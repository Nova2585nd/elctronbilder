name: Build Nova Connect for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Self test
        run: npm test
      - name: Build Windows EXE
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Connect-Windows
          path: |
            dist/NovaConnect-Setup-*.exe
            dist/NovaConnect-Portable-*.exe
          if-no-files-found: error
